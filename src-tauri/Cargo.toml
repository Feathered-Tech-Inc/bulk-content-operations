[package]
name = "bulk-content-operations"
version = "1.0.13"
description = "Bulk Content Operations"
authors = ["Feathered Tech Inc."]
license = ""
repository = ""
edition = "2021"
rust-version = "1.96.1"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
name = "app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.6.3", features = [] }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
log = "0.4"
tauri = { version = "2.11.4", features = [] }
tauri-plugin-log = "2"
keyring = "=4.1.2"
